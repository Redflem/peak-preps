<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peak Preps — Current Orders</title>
<style>
  :root { --olive:#68734a; --dark:#222; --light:#f5f5f2; --card:#fff; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Arial,Helvetica,sans-serif; background:var(--light); color:var(--dark); }
  .wrap { max-width:760px; margin:auto; padding:18px; }
  header { background:#fff; border-radius:18px; overflow:hidden; box-shadow:0 2px 12px #00000012; margin-bottom:18px; }
  .hero { padding:28px 24px 18px; text-align:center; }
  .logo { max-width:310px; width:75%; height:auto; margin-bottom:10px; }
  h1 { margin:4px 0; font-size:28px; }
  .sub { color:#666; margin:8px 0 0; }
  .notice { background:#eef0e8; padding:13px 18px; font-size:14px; text-align:center; }
  .back { display:inline-block; color:var(--olive); text-decoration:none; font-weight:800; font-size:14px; margin:0 0 18px 2px; }
  .week-tabs { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:16px; }
  .week-tab { border:1px solid #d4d6ce; background:#fff; color:#444; border-radius:11px; padding:11px 8px; font:inherit; font-size:13px; font-weight:800; cursor:pointer; }
  .week-tab.active { background:var(--olive); color:#fff; border-color:var(--olive); }
  section { background:var(--card); border-radius:18px; padding:22px; margin-bottom:16px; box-shadow:0 2px 12px #0000000c; }
  h2 { margin:0 0 4px; font-size:21px; }
  .week-range { color:#666; font-size:14px; margin-bottom:18px; }
  .privacy-note { background:#f3f4ee; border-radius:10px; padding:10px 12px; color:#666; font-size:12px; line-height:1.4; margin-bottom:16px; }
  .order-card { border:1px solid #ddd; border-radius:14px; padding:15px; margin:12px 0; }
  .order-top { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
  .customer { font-size:18px; font-weight:900; }
  .fulfillment { font-size:12px; font-weight:800; color:#666; background:#f0f1ec; padding:6px 9px; border-radius:999px; white-space:nowrap; }
  .status { font-size:11px; color:#666; margin-top:4px; }
  .meal-list { margin:12px 0 0; padding:0; list-style:none; }
  .meal-list li { border-top:1px solid #eee; padding:9px 0; display:flex; justify-content:space-between; gap:12px; }
  .meal-qty { font-weight:800; white-space:nowrap; }
  .empty { text-align:center; color:#666; padding:20px 8px; }
  .error { background:#f8eeee; color:#8a3d3d; border-radius:10px; padding:12px; font-size:13px; }
  .loading { color:#777; text-align:center; padding:20px; }
  footer { text-align:center; color:#999; font-size:10px; margin:18px 0 8px; }
  @media (max-width:560px) {
    .order-top { align-items:flex-start; }
    .customer { font-size:17px; }
  }
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="hero">
    <img class="logo" src="peak-preps-logo.png" alt="Peak Preps logo">
    <h1>Current Orders</h1>
    <p class="sub">See what's been ordered for this week and next week.</p>
  </div>
</header>

<a class="back" href="index.html">← Back to Weekly Meal Prep</a>

<div class="week-tabs" aria-label="Choose order week">
  <button type="button" id="thisWeekBtn" class="week-tab active">This Week</button>
  <button type="button" id="nextWeekBtn" class="week-tab">Next Week</button>
</div>

<section>
  <div id="content" class="loading">Loading current orders from Google Sheets…</div>
</section>

<footer>Peak Preps • Orders View</footer>
</div>

<script>
const SHEET_ID = '1YsiaXXp-aFLQHMPY3aPi_tuiX9fRMymnVcnt1ouEcg4';
const ORDERS_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=ORDERS&range=A2:S1000`;
const ITEMS_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=ORDER%20ITEMS&range=A2:I2000`;

let allOrders = [];
let selectedWeek = 0;

function parseGoogleDate(value) {
  if (value instanceof Date) return value;
  const s = String(value || '').trim();
  const m = s.match(/^Date\((\d+),(\d+),(\d+)\)$/);
  if (m) return new Date(Number(m[1]), Number(m[2]), Number(m[3]));
  const d = new Date(s);
  return isNaN(d) ? null : d;
}

function dateKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function startOfWeek(d) {
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const day = x.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  x.setDate(x.getDate() + diff);
  return x;
}

function addDays(d, n) {
  const x = new Date(d);
  x.setDate(x.getDate() + n);
  return x;
}

function weekInfo(offset) {
  const monday = addDays(startOfWeek(new Date()), offset * 7);
  const sunday = addDays(monday, 6);
  return { monday, sunday, start:dateKey(monday), end:dateKey(sunday) };
}

function formatDate(d) {
  return d.toLocaleDateString('en-US', {month:'long', day:'numeric', year:'numeric'});
}

function parseGviz(text) {
  const jsonText = text
    .replace(/^\/\*O_o\*\/\s*/, '')
    .replace(/^google\.visualization\.Query\.setResponse\(/, '')
    .replace(/\);\s*$/, '');
  const data = JSON.parse(jsonText);
  const rows = (data.table && data.table.rows) || [];
  return rows.map(r => (r.c || []).map(c => c ? c.v : ''));
}

async function fetchSheet(url) {
  const response = await fetch(url, {cache:'no-store'});
  if (!response.ok) throw new Error('Google Sheet request failed: ' + response.status);
  return parseGviz(await response.text());
}

async function loadOrders() {
  try {
    const [orderRows, itemRows] = await Promise.all([
      fetchSheet(ORDERS_URL),
      fetchSheet(ITEMS_URL)
    ]);

    const itemMap = new Map();
    itemRows.forEach(row => {
      const orderId = String(row[0] || '').trim();
      const mealName = String(row[3] || '').trim();
      const qty = Number(row[4]) || 0;
      if (!orderId || !mealName || qty <= 0) return;
      if (!itemMap.has(orderId)) itemMap.set(orderId, []);
      const existing = itemMap.get(orderId).find(x => x.name === mealName);
      if (existing) existing.qty += qty;
      else itemMap.get(orderId).push({name:mealName, qty});
    });

    allOrders = orderRows.map(row => {
      const status = String(row[0] || '').trim();
      const id = String(row[1] || '').trim();
      const pickup = parseGoogleDate(row[3]);
      return {
        status,
        id,
        pickup,
        pickupKey: pickup ? dateKey(pickup) : '',
        name: String(row[4] || '').trim() || 'Customer',
        fulfillment: String(row[6] || '').trim().toLowerCase(),
        items: itemMap.get(id) || []
      };
    }).filter(o => o.id && o.pickup && o.status.toLowerCase() !== 'cancelled' && o.items.length);

    render();
  } catch (err) {
    console.error(err);
    document.getElementById('content').innerHTML =
      `<div class="error"><strong>We couldn't load the current orders.</strong><br>Make sure the spreadsheet is shared as <strong>Anyone with the link → Viewer</strong>, then refresh the page.<br><span style="font-size:11px">${String(err.message || err).replace(/</g,'&lt;')}</span></div>`;
  }
}

function render() {
  const info = weekInfo(selectedWeek);
  const orders = allOrders
    .filter(o => o.pickupKey >= info.start && o.pickupKey <= info.end)
    .sort((a,b) => a.name.localeCompare(b.name));

  const heading = selectedWeek === 0 ? 'This Week' : 'Next Week';
  let html = `<h2>${heading}</h2><div class="week-range">${formatDate(info.monday)} – ${formatDate(info.sunday)}</div>`;
  html += `<div class="privacy-note">Showing customer name, fulfillment type, and meals/quantities only. Contact information, payment details, and order totals are not displayed.</div>`;

  if (!orders.length) {
    html += `<div class="empty">No orders have been placed for ${heading.toLowerCase()} yet.</div>`;
  } else {
    html += orders.map(order => {
      const fulfillment = order.fulfillment === 'delivery' ? 'Delivery' : 'Pickup';
      const status = order.status ? `Status: ${escapeHtml(order.status)}` : '';
      const meals = order.items.map(item =>
        `<li><span>${escapeHtml(item.name)}</span><span class="meal-qty">× ${item.qty}</span></li>`
      ).join('');
      return `<div class="order-card">
        <div class="order-top">
          <div><div class="customer">${escapeHtml(order.name)}</div><div class="status">${status}</div></div>
          <div class="fulfillment">${fulfillment}</div>
        </div>
        <ul class="meal-list">${meals}</ul>
      </div>`;
    }).join('');
  }

  document.getElementById('content').innerHTML = html;
}

function escapeHtml(value) {
  return String(value).replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
}

document.getElementById('thisWeekBtn').addEventListener('click', () => {
  selectedWeek = 0;
  document.getElementById('thisWeekBtn').classList.add('active');
  document.getElementById('nextWeekBtn').classList.remove('active');
  render();
});

document.getElementById('nextWeekBtn').addEventListener('click', () => {
  selectedWeek = 1;
  document.getElementById('nextWeekBtn').classList.add('active');
  document.getElementById('thisWeekBtn').classList.remove('active');
  render();
});

loadOrders();
</script>
</body>
</html>
